name: Deploy Rspress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout util
        uses: actions/checkout@v4
        with:
          repository: NSNanoCat/util
          path: packages/util
          fetch-depth: 1
      - name: Checkout URL
        uses: actions/checkout@v4
        with:
          repository: NSNanoCat/URL
          path: packages/url
          fetch-depth: 1
      - name: Checkout gRPC
        uses: actions/checkout@v4
        with:
          repository: NSNanoCat/gRPC
          path: packages/grpc
          fetch-depth: 1
      - name: Checkout FlatBufferRoot
        uses: actions/checkout@v4
        with:
          repository: NSNanoCat/FlatBufferRoot
          path: packages/flatbuffer-root
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Rspress
        run: pnpm build
        env:
          NSNANOCAT_UTIL_ROOT: ${{ github.workspace }}/packages/util
          NSNANOCAT_URL_ROOT: ${{ github.workspace }}/packages/url
          NSNANOCAT_GRPC_ROOT: ${{ github.workspace }}/packages/grpc
          NSNANOCAT_FLATBUFFER_ROOT_ROOT: ${{ github.workspace }}/packages/flatbuffer-root
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
